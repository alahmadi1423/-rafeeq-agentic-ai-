name: Rafeeq Engineering Loop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: -rafeeq-agentic-ai-main/rafeeq-agentic-ai
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: -rafeeq-agentic-ai-main/rafeeq-agentic-ai/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q app evals tests

      - name: Run unit tests
        run: PYTHONPATH=. python -m pytest -q

      - name: Run deterministic offline evaluations
        run: PYTHONPATH=. python -m evals.run_evals
